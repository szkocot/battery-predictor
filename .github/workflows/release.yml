name: Build release app

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false

      - name: Validate release
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must be vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          gh release view "$RELEASE_TAG" > /dev/null
          echo "APP_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
          echo "APP_BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Run tests
        run: swift test

      - name: Build universal app
        run: bash scripts/build-app.sh --arch arm64 --arch x86_64

      - name: Verify and package
        shell: bash
        run: |
          app="dist/Battery Predictor.app"
          codesign --verify --strict --verbose=2 "$app"
          plutil -lint "$app/Contents/Info.plist"
          lipo "$app/Contents/MacOS/BatteryPredictor" -verify_arch arm64 x86_64
          actual_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")
          test "$actual_version" = "$APP_VERSION"
          cd dist
          archive="Battery-Predictor-${RELEASE_TAG}-universal.zip"
          ditto -c -k --sequesterRsrc --keepParent "Battery Predictor.app" "$archive"
          shasum -a 256 "$archive" > "$archive.sha256"

      - name: Attach app to release
        run: |
          gh release upload "$RELEASE_TAG" \
            "dist/Battery-Predictor-${RELEASE_TAG}-universal.zip" \
            "dist/Battery-Predictor-${RELEASE_TAG}-universal.zip.sha256" \
            --clobber
